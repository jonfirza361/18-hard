
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS 3D Transforms</title>

    <style>
        body {
            background-color: #101827;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 800px;
        }

        .box {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #2196f3, #673ab7);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border-radius: 15px;

            transition: transform 0.8s ease;
        }

        .box:hover {
            transform: rotateY(180deg) rotateX(20deg);
        }
    </style>
</head>

<body>

    <div class="box">
        3D BOX
    </div>

</body>
</html>
